version: '3.8'

services:
  ml-service:
    build: .
    ports:
      - "8001:8001"
    environment:
      - LARAVEL_API_BASE_URL=${LARAVEL_API_BASE_URL:-http://localhost:8000}
      - LARAVEL_API_KEY=${LARAVEL_API_KEY:-}
      - ML_SERVICE_PORT=8001
      - ML_SERVICE_HOST=0.0.0.0
      - ML_SERVICE_API_KEY=${ML_SERVICE_API_KEY:-}
      - MODEL_STORAGE_PATH=/app/models
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    restart: unless-stopped

